name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest-cov

      - name: Lint with ruff
        run: |
          ruff check src/ --ignore=E501

      - name: Type check
        run: |
          python -c "import sys; sys.path.insert(0,'src'); from src.models import *; from src.core.graph_assembler import *; from src.core.view_model import *; from src.core.recursive_decomposer import *; from src.core.quality import *; print('All imports OK')"

      - name: Run core tests
        run: |
          python -m pytest tests/test_p0_fixes.py tests/test_schema.py tests/test_graph_dag.py tests/test_validators_basic.py tests/test_assumptions.py -v --tb=short

      - name: Seed quality check
        run: |
          python scripts/check_seed_quality.py

      - name: Verify install deps script exists
        run: |
          python -c "import ast; ast.parse(open('scripts/install_deps.py').read()); print('install_deps.py: OK')"
          python -c "import ast; ast.parse(open('scripts/build_topic.py').read()); print('build_topic.py: OK')"
          python -c "import ast; ast.parse(open('scripts/run_benchmarks.py').read()); print('run_benchmarks.py: OK')"
