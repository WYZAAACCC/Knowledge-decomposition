domain: optics
edges:
- assumptions:
  - isotropic_medium
  - planar_interface
  derivation_steps:
  - 根据费马原理，光线传播时间最短
  - 计算光从一点经界面到另一点的时间
  - 时间 t = (路径1)/v₁ + (路径2)/v₂
  - 利用折射率 n = c/v
  - 对路径变分求极值
  - 得到斯涅尔定律 n₁sinθ₁ = n₂sinθ₂
  from: law.refraction
