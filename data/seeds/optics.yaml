  type: requires
- assumptions:
  - paraxial_approximation
  - thin_lens
  - spherical_surfaces
  derivation_steps:
  - 从折射定律出发
  - 考虑透镜前后两个球面的折射
  - 应用傍轴近似 sinθ ≈ θ
  - 推导单个球面的成像公式
  - 将两个球面的公式组合
  - 得到薄透镜公式 1/f = 1/d_o + 1/d_i
  from: eq.thin_lens
