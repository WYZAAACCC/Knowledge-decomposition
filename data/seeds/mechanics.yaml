- assumptions:
  - inertial_frame
  - point_mass
  - constant_mass
  derivation_steps:
  - 力的操作定义：力是使物体产生加速度的原因
  - 通过实验确定力与加速度的线性关系
  - 比例系数定义为质量
  - 得到 F = ma
  from: law.newton_second
  id: edge.newton_second.derives_from.definition_force
  math_used:
  - linear_proportionality
  path_id: path.newton_second.canonical
  to: definition.force
  type: derives_from
- assumptions:
  - constant_mass
  - one_dimensional_motion
  derivation_steps:
  - 从牛顿第二定律 F = ma 出发
  - 将加速度表示为 a = dv/dt
  - 功的定义 W = ∫ F dx
  - 代入并积分：W = ∫ m (dv/dt) dx
  - 利用 dx = v dt 变换
  - 得到 W = ∫ m v dv
  - 积分得到 W = ½m(v₂² - v₁²)
  - 即 W = ΔK
  from: eq.work_energy_theorem
  id: edge.work_energy_theorem.derives_from.newton_second
  math_used:
  - integral
  - chain_rule
  path_id: path.work_energy.canonical
  to: law.newton_second
  type: derives_from
- assumptions: []
  from: eq.work_energy_theorem
  id: edge.work_energy_theorem.requires.kinetic_energy
  path_id: path.work_energy.canonical
  to: concept.kinetic_energy
  type: requires
- assumptions:
  - steady_flow
  - incompressible
  - inviscid
  - along_streamline
  derivation_steps:
  - 从质量守恒出发
  - 对于不可压缩流体，体积流量守恒
  - 得到连续性方程 A₁v₁ = A₂v₂
  from: eq.bernoulli
  id: edge.bernoulli.derives_from.continuity
  math_used:
  - conservation_of_mass
  path_id: path.bernoulli.canonical
  to: eq.continuity
  type: derives_from
