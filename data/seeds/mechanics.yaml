  path_id: path.bernoulli.canonical
  to: math.line_integral
  type: uses_math
- assumptions:
  - steady_flow
  - incompressible
  - horizontal_flow
  derivation_steps:
  - 在管道收缩处，根据连续性方程，流速增加
  - 根据伯努利方程，流速增加处压强降低
  - 测量收缩前后的压差
  - 通过伯努利方程计算流速
  from: application.venturi_meter
  id: edge.venturi_meter.applies_to.bernoulli
  path_id: path.venturi.application
  to: eq.bernoulli
  type: applies_to
- assumptions:
  - steady_flow
  - incompressible
  - stagnation_point
  derivation_steps:
  - 皮托管前端为驻点，流速为零
  - 根据伯努利方程，驻点处动压转化为静压
  - 测量总压和静压的差值
  - 通过伯努利方程计算流速
  from: application.pitot_tube
  id: edge.pitot_tube.applies_to.bernoulli
  path_id: path.pitot.application
  to: eq.bernoulli
  type: applies_to
