- assumptions:
  - low_density
  - no_intermolecular_forces
  - elastic_collisions
  - point_particles
  derivation_steps:
  - 从分子动理论基本假设出发
  - 计算分子对器壁的碰撞频率
  - 计算单个分子对器壁的冲量
  - 对所有分子求平均
  - 得到压强与分子平均动能的关系
  - 利用温度与平均动能的关系 T ∝ ⟨½mv²⟩
  - 结合阿伏伽德罗定律得到 pV = nRT
  from: eq.ideal_gas
