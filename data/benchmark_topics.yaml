    prerequisites:
      - postulate.speed_of_light_constant
      - postulate.relativity_principle
      - thought_experiment.light_clock

  - id: phenomenon.photoelectric_effect
    zh: 光电效应
    domain: modern_physics
    prerequisites:
      - concept.photon
      - concept.work_function
      - law.conservation_energy
      - experiment.photoelectric

  - id: relation.de_broglie
    zh: 德布罗意关系
    domain: modern_physics
    prerequisites:
      - principle.wave_particle_duality
      - relation.einstein_energy
      - analogy.light_matter

  - id: model.bohr_atom
    zh: 玻尔原子模型
    domain: modern_physics
    prerequisites:
      - postulate.stationary_states
      - postulate.quantized_angular_momentum
      - classical.centripetal_force
      - coulomb.law

  # 数学工具
  - id: math.derivative
    zh: 导数
    domain: math_tools
    prerequisites:
      - concept.limit
      - concept.function
      - concept.rate_of_change

  - id: math.integral
    zh: 积分
    domain: math_tools
    prerequisites:
      - concept.area_under_curve
      - concept.limit_of_sum
      - math.derivative

  - id: math.vector
    zh: 向量
    domain: math_tools
    prerequisites:
      - concept.magnitude
      - concept.direction
      - operation.vector_addition

  - id: math.differential_equation
    zh: 微分方程
    domain: math_tools
    prerequisites:
      - math.derivative
      - concept.function
      - concept.initial_condition