    prerequisites:
      - law.refraction
      - assumption.paraxial_approximation
      - model.geometric_optics
      - concept.focal_length

  - id: phenomenon.youngs_double_slit
    zh: 杨氏双缝干涉
    domain: optics
    prerequisites:
      - phenomenon.interference
      - assumption.coherent_sources
      - concept.path_difference
      - concept.wavelength

  # 近代物理
  - id: relativity.time_dilation
    zh: 时间延缓
