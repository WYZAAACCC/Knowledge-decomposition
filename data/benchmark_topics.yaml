  - id: law.reflection
    zh: 反射定律
    domain: optics
    prerequisites:
      - concept.light_ray
      - concept.smooth_surface
      - principle.fermat

  - id: law.refraction
    zh: 折射定律
    domain: optics
    prerequisites:
      - concept.refractive_index
      - concept.wavefront
      - principle.fermat
      - model.wave_optics

  - id: eq.thin_lens
    zh: 薄透镜公式
