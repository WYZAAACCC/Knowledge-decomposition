      - concept.changing_flux
      - law.lenz
      - definition.emf

  - id: law.ohm
    zh: 欧姆定律
    domain: electromagnetism
    prerequisites:
      - concept.electric_current
      - concept.voltage
      - concept.resistance
      - assumption.linear_material

