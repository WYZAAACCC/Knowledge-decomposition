topics:
  # 力学
  - id: concept.velocity
    zh: 速度
    domain: mechanics
    prerequisites:
      - concept.displacement
      - concept.time
      - math.derivative

  - id: concept.acceleration
    zh: 加速度
    domain: mechanics
    prerequisites:
      - concept.velocity
      - math.derivative

  - id: law.newton_second
    zh: 牛顿第二定律
    domain: mechanics
    prerequisites:
      - concept.force
      - concept.mass
      - concept.acceleration
      - definition.force

  - id: law.conservation_energy_mechanical
    zh: 机械能守恒定律
    domain: mechanics
    prerequisites:
      - concept.kinetic_energy
      - concept.potential_energy
      - law.work_energy_theorem
      - assumption.conservative_forces

  - id: law.conservation_momentum
    zh: 动量守恒定律
    domain: mechanics
    prerequisites:
      - concept.momentum
      - law.newton_third
      - assumption.no_external_forces

  - id: eq.simple_harmonic_motion
    zh: 简谐振动方程
    domain: mechanics
    prerequisites:
      - law.newton_second
      - concept.linear_restoring_force
      - math.differential_equation
      - math.trigonometric_function

  - id: eq.bernoulli
    zh: 伯努利方程
    domain: mechanics
    prerequisites:
      - law.mass_conservation
      - eq.continuity
      - eq.euler_streamline
      - assumption.steady_flow
      - assumption.incompressible
      - assumption.inviscid
      - assumption.along_streamline
    applications:
      - application.venturi_meter
      - application.pitot_tube

  # 热学
  - id: eq.ideal_gas
    zh: 理想气体状态方程
    domain: thermodynamics
    prerequisites:
      - concept.pressure
      - concept.volume
      - concept.temperature
      - model.kinetic_theory
      - assumption.low_density

  - id: law.first_law_thermodynamics
    zh: 热力学第一定律
    domain: thermodynamics
    prerequisites:
      - concept.internal_energy
      - concept.heat
      - concept.work
      - law.conservation_energy

  - id: concept.entropy
    zh: 熵
    domain: thermodynamics
    prerequisites:
      - concept.reversible_process
      - concept.heat_transfer
      - law.second_law_thermodynamics

  - id: law.second_law_thermodynamics
    zh: 热力学第二定律
    domain: thermodynamics
    prerequisites:
      - concept.entropy
      - concept.irreversible_process
      - principle.carnot_efficiency

  # 电磁学
  - id: law.coulomb
    zh: 库仑定律
    domain: electromagnetism
    prerequisites:
      - concept.electric_charge
      - concept.distance
      - principle.superposition

  - id: law.gauss_electric
    zh: 高斯定律
    domain: electromagnetism
    prerequisites:
      - concept.electric_flux
      - concept.closed_surface
      - law.coulomb

  - id: concept.electric_potential
    zh: 电势
    domain: electromagnetism
    prerequisites:
